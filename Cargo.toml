[package]
name = "cleankakao"
version = "0.1.1"
edition = "2024"
description = "KakaoTalk PC ad-blocking system tray app for Windows"
license = "MIT"
repository = "https://github.com/ghostface2232/cleankakao"

[dependencies]
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_UI_Controls",
] }
tray-icon = "0.26"
muda = "0.21"
iced = { version = "0.14", features = ["tokio", "image-without-codecs"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "http2", "charset", "system-proxy"] }
tokio = { version = "1", features = ["full"] }
dirs = "7"
semver = "1"
sha2 = "0.10"
tempfile = "3"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["ico", "png", "bmp"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
