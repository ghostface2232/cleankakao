name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Validate version and test
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ("${{ github.ref_name }}" -ne "v$version") { throw "Tag must match Cargo.toml version v$version" }
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { throw "Tests failed" }

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $name = "cleankakao-$tag-x86_64"
          $packageDir = Join-Path "dist" $name
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\cleankakao.exe" $packageDir
          Copy-Item "README.md" $packageDir
          Copy-Item "LICENSE" $packageDir
          Compress-Archive -Path "$packageDir\*" -DestinationPath "dist\$name.zip" -Force
          Copy-Item "target\x86_64-pc-windows-msvc\release\cleankakao.exe" "dist\cleankakao-windows-x86_64.exe"

      - name: Upload GitHub Release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "dist\cleankakao-$tag-x86_64.zip"
          $exe = "dist\cleankakao-windows-x86_64.exe"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            $isDraft = gh release view $tag --json isDraft --jq '.isDraft'
            if ($isDraft -ne 'true') { throw "Published release assets are immutable; bump the version instead" }
            gh release upload $tag $zip $exe --clobber
          } else {
            gh release create $tag $zip $exe --title $tag --generate-notes --draft
          }
